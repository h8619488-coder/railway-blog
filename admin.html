<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>記事管理 | 小6の鉄道ブログ</title>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="images/icon.png">

</head>


<body>


<header>

<h1>
🚆 小6の鉄道ブログ
</h1>

<p>
管理者ページ
</p>

</header>



<nav>

<a href="index.html">
🏠 ホーム
</a>

<a href="articles.html">
📰 記事一覧
</a>

<button
class="button"
id="logoutButton"
style="display:none;"
onclick="logout()">

ログアウト

</button>

</nav>



<main>


<!-- ログイン確認中 -->

<div
id="loading"
class="card">

<p>
🔐 ログイン状態を確認しています...
</p>

</div>



<!-- 管理画面 -->

<div
id="adminContent"
style="display:none;">



<div class="admin-box">


<h2>
📝 記事作成・編集
</h2>



<label for="title">
タイトル
</label>

<input
id="title"
type="text"
placeholder="記事タイトル">



<label for="image">
画像ファイル名
</label>

<input
id="image"
type="text"
placeholder="例：e5.jpg">


<p>
※画像は images フォルダに入れてください
</p>



<label for="description">
ホーム表示用説明
</label>

<textarea
id="description"
placeholder="記事の紹介文"></textarea>



<label for="content">
本文
</label>

<textarea
id="content"
placeholder="記事本文"></textarea>



<label for="category">
カテゴリー
</label>

<select id="category">

<option value="車両紹介">
🚄 車両紹介
</option>

<option value="駅紹介">
🚉 駅紹介
</option>

<option value="プラレール">
🚂 プラレール
</option>

</select>



<label for="status">
公開状態
</label>

<select id="status">

<option value="公開">
公開
</option>

<option value="下書き">
下書き
</option>

</select>



<button
class="button"
onclick="saveArticle()">

記事を保存

</button>


</div>



<div class="admin-box">


<h2>
📚 記事管理
</h2>


<div id="adminArticles">

</div>


</div>


</div>


</main>



<footer>

<p>
© 2026 小6の鉄道ブログ
</p>

</footer>



<script src="script.js"></script>



<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



const firebaseConfig = {

  apiKey:
    "AIzaSyC7LGKrT8aBjUxY2Z-sFEfdFcKJ9FFR6kU",

  authDomain:
    "railway-blog.firebaseapp.com",

  projectId:
    "railway-blog",

  storageBucket:
    "railway-blog.firebasestorage.app",

  messagingSenderId:
    "1069239857028",

  appId:
    "1:1069239857028:web:1b54657f409efc8d3137d1",

  measurementId:
    "G-EVX4TDW12K"

};



const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);



// ======================================
// ログイン状態を確認
// ======================================

onAuthStateChanged(
  auth,
  function(user) {


    const loading =
      document.getElementById("loading");

    const adminContent =
      document.getElementById("adminContent");

    const logoutButton =
      document.getElementById("logoutButton");


    if (user) {

      // ログイン済み

      loading.style.display =
        "none";

      adminContent.style.display =
        "block";

      logoutButton.style.display =
        "inline-block";


      // 記事一覧を読み込む

      if (
        typeof loadAdminArticles ===
        "function"
      ) {

        loadAdminArticles();

      }


    } else {

      // ログインしていない

      window.location.href =
        "login.html";

    }

  }
);



// ======================================
// ログアウト
// ======================================

window.logout =
async function() {

  try {

    await signOut(auth);

    window.location.href =
      "login.html";

  } catch (error) {

    console.error(error);

    alert(
      "ログアウトできませんでした。"
    );

  }

};

</script>



</body>

</html>
