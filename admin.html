<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
記事管理 | 小6の鉄道ブログ
</title>


<link rel="stylesheet" href="style.css">


<link rel="icon" href="images/icon.png">


</head>



<body>




<header>


<h1>
🚆 小6の鉄道ブログ
</h1>


<p>
記事管理ページ
</p>


</header>







<nav>


<a href="index.html">
🏠 ホーム
</a>


<a href="articles.html">
📰 記事一覧
</a>


</nav>








<main>






<div class="admin-box">





<h2>
📝 記事作成
</h2>







<label>
タイトル
</label>


<input id="title"
placeholder="記事タイトル">








<label>
画像ファイル名
</label>


<input id="image"
placeholder="例：e5.jpg">



<p>
※画像は images フォルダに入れてください
</p>








<label>
ホーム表示用説明
</label>


<textarea id="description"
placeholder="記事の紹介文">

</textarea>









<label>
本文
</label>


<textarea id="content"
placeholder="記事本文">

</textarea>








<label>
カテゴリー
</label>


<select id="category">


<option value="車両紹介">
🚄 車両紹介
</option>


<option value="駅紹介">
🚉 駅紹介
</option>


<option value="プラレール">
🚂 プラレール
</option>


</select>








<label>
公開状態
</label>


<select id="status">


<option value="公開">
公開
</option>


<option value="下書き">
下書き
</option>


</select>







<button class="button"
onclick="saveArticle()">

記事を保存

</button>






</div>








<div class="admin-box">



<h2>
📚 記事管理
</h2>




<div id="adminArticles">

</div>




</div>








</main>







<footer>


<p>
© 2026 小6の鉄道ブログ
</p>


</footer>







<script src="script.js"></script>


</body>


</html>
